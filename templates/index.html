<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘, 다른 것 하나</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <!-- 홈 화면 -->
        <section id="home-screen" class="screen">
            <p class="eyebrow">TODAY, ONE DIFFERENT THING</p>

            <h1>오늘, 다른 것 하나</h1>

            <p class="intro">
                오늘은 평소와 조금 다르게<br>
                해볼까요?
            </p>

            <button id="draw-button">
                ✦ 하나 뽑기
            </button>

            <button id="history-button" class="secondary-button">
                지난 발견 보기
            </button>
        </section>


        <!-- 오늘의 행동 화면 -->
        <section id="mission-screen" class="screen hidden">

            <p id="chain-message" class="chain-message hidden"></p>

            <p id="category" class="category"></p>

            <h2 id="mission-title"></h2>

            <p id="mission-description"></p>

            <button id="done-button">
                해봤어요
            </button>

            <button id="back-button" class="secondary-button">
                돌아가기
            </button>

        </section>


        <!-- 발견 기록 화면 -->
        <section id="record-screen" class="screen hidden">

            <p class="eyebrow">YOUR DISCOVERY</p>

            <h2>무엇을 발견했나요?</h2>

            <p class="record-guide">
                눈에 들어온 것, 새롭게 알게 된 것,<br>
                그냥 기억해두고 싶은 것도 괜찮아요.
            </p>

            <textarea
                id="discovery-input"
                placeholder="예상하지 못했던 것 하나를 적어보세요."
            ></textarea>

            <label for="photo-input" class="photo-button">
                📷 사진 추가
            </label>

            <input
                type="file"
                id="photo-input"
                accept="image/*"
            >

            <img
                id="photo-preview"
                class="photo-preview hidden"
                alt="선택한 사진 미리보기"
            >

            <p class="emotion-title">그때 어떤 느낌이었나요?</p>

            <div class="emotion-list">

                <button type="button" class="emotion-button" data-emotion="신기했다">
                    🤔 신기했다
                </button>

                <button type="button" class="emotion-button" data-emotion="기분이 좋았다">
                    😊 기분이 좋았다
                </button>

                <button type="button" class="emotion-button" data-emotion="별 생각 없었다">
                    😐 별 생각 없었다
                </button>

                <button type="button" class="emotion-button" data-emotion="궁금해졌다">
                    🧐 궁금해졌다
                </button>

            </div>

            <button id="save-button">
                기록하기
            </button>

            <button id="record-back-button" class="secondary-button">
                돌아가기
            </button>

        </section>


        <!-- 기록 완료 화면 -->
        <section id="complete-screen" class="screen hidden">

            <p class="eyebrow">DISCOVERY RECORDED</p>

            <h2>오늘의 발견을<br>기록했어요.</h2>

            <p id="saved-discovery" class="saved-discovery"></p>

            <button id="home-button">
                처음으로
            </button>

        </section>


        <!-- 지난 발견 -->
        <section id="history-screen" class="screen hidden">

            <p class="eyebrow">MY DISCOVERIES</p>

            <h2>지난 발견</h2>

            <div id="history-list"></div>

            <button id="history-back-button" class="secondary-button">
                처음으로
            </button>

        </section>


        <!-- 발견 상세 화면 -->
        <section id="detail-screen" class="screen hidden">

            <p id="detail-date" class="history-date"></p>

            <p id="detail-category" class="category"></p>

            <h2 id="detail-action-title"></h2>

            <p id="detail-action-description"></p>


            <!-- 이전 발견 -->
            <div id="detail-previous" class="detail-section hidden">

                <h3>이전 발견에서 이어졌어요</h3>

                <button
                    id="previous-discovery-button"
                    class="previous-discovery-button"
                    type="button"
                >
                    <span id="detail-previous-content"></span>
                    <span class="previous-discovery-arrow">→</span>
                </button>

            </div>


            <!-- 현재 발견 -->
            <div class="detail-section">

                <h3>무엇을 발견했나요?</h3>

                <p id="detail-content"></p>

            </div>


            <!-- 감정 -->
            <div class="detail-section">

                <h3>그때 어떤 느낌이었나요?</h3>

                <p id="detail-emotion" class="history-emotion"></p>

            </div>


            <!-- 사진 -->
            <img
                id="detail-image"
                class="history-image hidden"
                alt="발견 기록 사진"
            >


            <!-- AI 질문 -->
            <div class="detail-section">

                <h3>AI가 던진 질문</h3>

                <p id="detail-question" class="history-question"></p>

            </div>


            <!-- 생각 -->
            <div class="detail-section">

                <h3>AI 질문에 대한 나의 생각</h3>

                <p id="detail-reflection" class="history-reflection"></p>

            </div>


            <button id="detail-back-button" class="secondary-button">
                돌아가기
            </button>

        </section>


        <!-- AI 질문 -->
        <section id="reflection-screen" class="screen hidden">

            <p class="eyebrow">ONE MORE QUESTION</p>

            <h2 id="ai-question"></h2>

            <textarea
                id="reflection-input"
                placeholder="떠오르는 생각을 자유롭게 적어보세요."
            ></textarea>

            <button id="reflection-save-button">
                답변 저장
            </button>

            <button id="reflection-skip-button" class="secondary-button">
                건너뛰기
            </button>

        </section>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
